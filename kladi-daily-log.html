<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 수업일지 · 클라디수학학원</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
  }
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap');

  :root{
    --paper: #fbf6ee;
    --ink: #2c2416;
    --ink-soft: #6b6152;
    --rule: #e6dcc8;
    --accent: #d97a2e;
    --accent-deep: #a85a1e;
    --sage: #74805f;
    --sage-bg: #eef0e6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ece4d4;
    font-family: 'Pretendard', -apple-system, sans-serif;
    color: var(--ink);
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  .page-title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 6px;
  }

  .page-sub {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }

  .date-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .date-bar input[type=date] {
    font-family: 'Pretendard', sans-serif;
    font-size: 14.5px;
    padding: 7px 10px;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background: #fffdf9;
    color: var(--ink);
  }

  .status-tag { font-size: 12px; color: var(--sage); }

  .row {
    background: var(--paper);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(44,36,22,0.08);
  }

  .row-head {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
  }

  .row-head input[type=text] {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--accent-deep);
    border: none;
    background: transparent;
    padding: 2px 0;
    flex: 1;
  }

  .row-head input[type=text]:focus { outline: none; border-bottom: 1px solid var(--accent); }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 5px;
    line-height: 1;
  }
  .icon-btn:hover { color: var(--accent-deep); }

  .collapse-btn {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 4px;
    width: 16px;
  }

  .remove-btn {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .remove-btn:hover { color: var(--accent-deep); }

  .field { margin-bottom: 10px; }

  .field-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--sage);
    background: var(--sage-bg);
    display: inline-block;
    padding: 2px 8px;
    border-radius: 100px;
    margin-bottom: 5px;
  }

  .field textarea, .field input[type=text].field-input {
    width: 100%;
    resize: vertical;
    min-height: 38px;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background: #fffdf9;
    color: var(--ink);
    font-size: 14px;
    font-family: 'Pretendard', sans-serif;
    line-height: 1.6;
  }

  .field textarea:focus, .field input:focus { outline: none; border-color: var(--accent); }

  .row-preview {
    display: none;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row.collapsed .row-body { display: none; }
  .row.collapsed .row-preview { display: block; }
  .row.collapsed { padding-bottom: 14px; }

  .add-row-btn {
    display: block;
    width: 100%;
    background: transparent;
    border: 1px dashed var(--rule);
    border-radius: 6px;
    padding: 10px;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    margin-bottom: 20px;
  }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent-deep); }

  .actions { text-align: center; margin-bottom: 8px; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 100px;
    padding: 11px 28px;
    font-size: 14.5px;
    font-family: 'Pretendard', sans-serif;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-deep); }

  .save-status {
    text-align: center;
    font-size: 12.5px;
    color: var(--sage);
    min-height: 18px;
    margin-top: 8px;
  }

  .result {
    display: none;
    margin-top: 20px;
    background: var(--sage-bg);
    border-radius: 6px;
    padding: 20px 22px;
  }

  .result-label { font-size: 12.5px; color: var(--sage); font-weight: 600; margin-bottom: 10px; }
  .result-text { font-size: 14px; line-height: 1.8; white-space: pre-line; color: #3d4331; margin-bottom: 14px; }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--accent-deep);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 100px;
    padding: 5px 14px;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
  }
  .copy-btn:hover { background: #fff; border-color: var(--accent); }
  .copy-btn.copied { color: var(--sage); border-color: var(--sage); }

  .history { margin-top: 44px; border-top: 1px solid var(--rule); padding-top: 24px; }
  .history-title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 17px; margin-bottom: 14px; }
  .history-day { background: var(--paper); border-radius: 6px; padding: 14px 18px; margin-bottom: 10px; }
  .history-date { font-size: 13px; font-weight: 500; color: var(--accent-deep); margin-bottom: 6px; }
  .history-line { font-size: 13px; line-height: 1.7; color: var(--ink); }
  .history-empty { font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>

<div class="wrap">
  <div class="page-title">오늘의 수업일지</div>
  <div class="page-sub">박유경T · 진도 · 오답노트 · 숙제 · 특이사항을 함께 기록하고 누적합니다</div>

  <div class="date-bar">
    <input type="date" id="dateInput">
    <span class="status-tag" id="dateStatus"></span>
  </div>

  <div id="rows"></div>

  <button class="add-row-btn" onclick="addRow()">+ 학생 추가</button>

  <div class="actions">
    <button class="btn" onclick="saveAndBuild()">저장하고 정리하기</button>
  </div>
  <div class="save-status" id="saveStatus"></div>

  <div class="result" id="result">
    <div class="result-label">정리된 내용 (복사해서 Claude에게 붙여넣으세요)</div>
    <div class="result-text" id="resultText"></div>
    <button class="copy-btn" onclick="copyResult()">복사</button>
  </div>

  <div class="history">
    <div class="history-title">지난 기록</div>
    <div id="historyList"><div class="history-empty">불러오는 중...</div></div>
  </div>
</div>

<script>
const defaultStudents = ["김리사", "유이재", "이채원B", "김유주", "배은빈", "서민경", "엄승유", "여채율", "이아진", "장서은", "정지현", "최준서"];
const fieldDefs = [
  { key: 'lesson', label: '수업(진도)' },
  { key: 'test', label: 'TEST' },
  { key: 'wrongnote', label: '오답노트' },
  { key: 'lastHW', label: '지난숙제' },
  { key: 'nextHW', label: '다음숙제' },
  { key: 'note', label: '특이사항' }
];
const rowsEl = document.getElementById('rows');
const dateInput = document.getElementById('dateInput');

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
dateInput.value = todayStr();

function updatePreview(row) {
  const noteVal = row.querySelector('[data-key=note]').value.trim();
  const lessonVal = row.querySelector('[data-key=lesson]').value.trim();
  const preview = row.querySelector('.row-preview');
  const parts = [];
  if (lessonVal) parts.push('진도: ' + lessonVal);
  if (noteVal) parts.push('특이사항: ' + noteVal);
  preview.textContent = parts.length > 0 ? parts.join(' · ') : '(입력 없음)';
}

function makeRow(name, data) {
  data = data || {};
  const row = document.createElement('div');
  row.className = 'row';

  let fieldsHTML = '';
  fieldDefs.forEach(function(f) {
    fieldsHTML +=
      '<div class="field">' +
        '<div class="field-label">' + f.label + '</div>' +
        '<textarea data-key="' + f.key + '" placeholder="' + f.label + ' 입력">' + (data[f.key] || '') + '</textarea>' +
      '</div>';
  });

  row.innerHTML =
    '<div class="row-head">' +
      '<button class="collapse-btn" onclick="toggleCollapse(this)">▾</button>' +
      '<input type="text" class="name-input" value="' + (name || '') + '" placeholder="학생 이름">' +
      '<button class="icon-btn" onclick="moveRow(this, -1)" title="위로">▲</button>' +
      '<button class="icon-btn" onclick="moveRow(this, 1)" title="아래로">▼</button>' +
      '<button class="remove-btn" onclick="this.closest(\'.row\').remove()">삭제</button>' +
    '</div>' +
    '<div class="row-body">' + fieldsHTML + '</div>' +
    '<div class="row-preview"></div>';

  fieldDefs.forEach(function(f) {
    row.querySelector('[data-key="' + f.key + '"]').addEventListener('input', function() { updatePreview(row); });
  });
  updatePreview(row);
  return row;
}

function toggleCollapse(btn) {
  const row = btn.closest('.row');
  row.classList.toggle('collapsed');
  btn.textContent = row.classList.contains('collapsed') ? '▸' : '▾';
  if (row.classList.contains('collapsed')) updatePreview(row);
}

function moveRow(btn, direction) {
  const row = btn.closest('.row');
  if (direction === -1 && row.previousElementSibling) {
    rowsEl.insertBefore(row, row.previousElementSibling);
  } else if (direction === 1 && row.nextElementSibling) {
    rowsEl.insertBefore(row.nextElementSibling, row);
  }
}

function addRow(name, data) {
  rowsEl.appendChild(makeRow(name, data));
}

function renderDefaultRows() {
  rowsEl.innerHTML = '';
  defaultStudents.forEach(function(name) { addRow(name, {}); });
}

function currentKey() { return 'diary:' + dateInput.value; }

function readRowData(row) {
  const data = { name: row.querySelector('.name-input').value.trim() };
  fieldDefs.forEach(function(f) {
    data[f.key] = row.querySelector('[data-key="' + f.key + '"]').value.trim();
  });
  return data;
}

async function loadForDate() {
  const statusEl = document.getElementById('dateStatus');
  statusEl.textContent = '불러오는 중...';
  rowsEl.innerHTML = '';
  document.getElementById('result').style.display = 'none';
  try {
    const res = await window.storage.get(currentKey(), false);
    const data = JSON.parse(res.value);
    data.forEach(function(e) { addRow(e.name, e); });
    statusEl.textContent = '저장된 기록 불러옴';
  } catch (e) {
    renderDefaultRows();
    statusEl.textContent = '새 기록';
  }
}

dateInput.addEventListener('change', loadForDate);

function hasAnyContent(e) {
  return fieldDefs.some(function(f) { return e[f.key] && e[f.key].length > 0; });
}

async function saveAndBuild() {
  const saveStatus = document.getElementById('saveStatus');
  const rows = Array.from(rowsEl.querySelectorAll('.row'));
  const entries = rows.map(readRowData).filter(function(e) { return e.name.length > 0; });

  try {
    const result = await window.storage.set(currentKey(), JSON.stringify(entries), false);
    if (!result) throw new Error('save failed');
    saveStatus.textContent = dateInput.value + ' 기록이 저장되었습니다.';
  } catch (e) {
    saveStatus.textContent = '저장에 실패했습니다. 다시 시도해주세요.';
    return;
  }

  const withContent = entries.filter(hasAnyContent);
  const resultBox = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  if (withContent.length === 0) {
    resultText.textContent = '입력된 내용이 없습니다.';
  } else {
    const lines = [dateInput.value + ' 수업일지야, 이거 보고 정리해줘:', ''];
    withContent.forEach(function(e) {
      lines.push('■ ' + e.name);
      fieldDefs.forEach(function(f) {
        if (e[f.key]) lines.push('[' + f.label + '] ' + e[f.key]);
      });
      lines.push('');
    });
    resultText.textContent = lines.join('\n').trim();
  }
  resultBox.style.display = 'block';
  resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  loadHistory();
}

function copyResult() {
  const text = document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text).then(function() {
    const btn = document.querySelector('.copy-btn');
    const original = btn.textContent;
    btn.textContent = '복사됨';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  });
}

async function loadHistory() {
  const historyList = document.getElementById('historyList');
  try {
    const listRes = await window.storage.list('diary:', false);
    const keys = (listRes && listRes.keys) ? listRes.keys.slice() : [];
    if (keys.length === 0) {
      historyList.innerHTML = '<div class="history-empty">아직 기록이 없습니다.</div>';
      return;
    }
    keys.sort().reverse();
    const items = [];
    for (const k of keys) {
      try {
        const r = await window.storage.get(k, false);
        const entries = JSON.parse(r.value).filter(hasAnyContent);
        if (entries.length === 0) continue;
        const dateLabel = k.replace('diary:', '');
        const lines = entries.map(function(e) {
          const parts = [];
          fieldDefs.forEach(function(f) { if (e[f.key]) parts.push(f.label + ': ' + e[f.key]); });
          return '<strong>' + e.name + '</strong> — ' + parts.join(' / ');
        }).join('<br>');
        items.push('<div class="history-day"><div class="history-date">' + dateLabel + '</div><div class="history-line">' + lines + '</div></div>');
      } catch (e) {}
    }
    historyList.innerHTML = items.length > 0 ? items.join('') : '<div class="history-empty">아직 기록이 없습니다.</div>';
  } catch (e) {
    historyList.innerHTML = '<div class="history-empty">기록을 불러오지 못했습니다.</div>';
  }
}

loadForDate();
loadHistory();
</script>

</body>
</html>
