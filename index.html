<!-- test comment -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>박유경T 학생 관리 · 클라디수학학원</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap">
<style>
/* Celeste 브랜드 팔레트 — 미드나잇 네이비 #2B2A4C · 벚꽃 핑크 #FFD9E8/#FFB6C9 · 크림 #FFF9FB · 라벤더 #C9B6E4 · 골드 #E8C468
   accent=벚꽃 로즈(관리보강·제목), sage=라벤더(선택 상태), absent=밤하늘 블루(결석보강), jikjeon=골드(직전보강) */
:root{
--brand-navy:#2B2A4C;
--brand-pink:#FFD9E8;
--brand-rose:#FFB6C9;
--brand-cream:#FFF9FB;
--brand-lavender:#C9B6E4;
--brand-gold:#E8C468;
--bg:#F5EFF6;
--surface:#FFF9FB;
--surface-2:#F2E9F3;
--ink:#2B2A4C;
--muted:#76718F;
--faint:#ABA5C2;
--border:#EADDEA;
--accent:#C2557D;
--accent-ink:#FFFFFF;
--accent-soft:#FFE3ED;
--sage:#8E7BBE;
--sage-soft:#EEE7F8;
--sage-ink:#4B3F78;
--absent:#5368A8;
--absent-soft:#E5E9F6;
--absent-ink:#34437A;
--jikjeon:#C29A2E;
--jikjeon-soft:#FBF0D3;
--jikjeon-ink:#735A12;
--shadow: 0 1px 2px rgba(43,42,76,0.05), 0 8px 24px -14px rgba(43,42,76,0.30);
--sun:#D64545;
--exam-bg:#2B2A4C;
--exam-ink:#FFD9E8;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#1E1D36;
--surface:#2B2A4C;
--surface-2:#35345A;
--ink:#FFF9FB;
--muted:#C9B6E4;
--faint:#7F7AA3;
--border:#413F68;
--accent:#FFB6C9;
--accent-ink:#2B2A4C;
--accent-soft:#4A3552;
--sage:#C9B6E4;
--sage-soft:#3C3863;
--sage-ink:#EDE4FA;
--absent:#9DAEE6;
--absent-soft:#2E3562;
--absent-ink:#D0D9F7;
--jikjeon:#E8C468;
--jikjeon-soft:#4A4128;
--jikjeon-ink:#F5E2A6;
--shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -14px rgba(0,0,0,0.6);
--sun:#FF8A8A;
--exam-bg:#C9B6E4;
--exam-ink:#2B2A4C;
}
}
:root[data-theme="dark"]{
--bg:#1E1D36; --surface:#2B2A4C; --surface-2:#35345A; --ink:#FFF9FB;
--muted:#C9B6E4; --faint:#7F7AA3; --border:#413F68;
--accent:#FFB6C9; --accent-ink:#2B2A4C; --accent-soft:#4A3552;
--sage:#C9B6E4; --sage-soft:#3C3863; --sage-ink:#EDE4FA;
--absent:#9DAEE6; --absent-soft:#2E3562; --absent-ink:#D0D9F7;
--jikjeon:#E8C468; --jikjeon-soft:#4A4128; --jikjeon-ink:#F5E2A6;
--shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -14px rgba(0,0,0,0.6);
--sun:#FF8A8A; --exam-bg:#C9B6E4; --exam-ink:#2B2A4C;
}
*{box-sizing:border-box;}
body{
margin:0;
background:var(--bg);
color:var(--ink);
font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;
padding:40px 20px 80px;
}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px;}
h1{font-size:24px;margin:0;font-weight:700;}
.sub{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.6;}

/* 상단 헤더 — 네이비 밤하늘 + 흩날리는 벚꽃잎 + 작은 별빛 점 */
.brand-hero{
position:relative;overflow:hidden;
background:var(--brand-navy);border:1px solid var(--border);
border-radius:20px;padding:28px 28px 26px;
}
.brand-hero h1{color:var(--brand-cream);position:relative;}
.brand-hero .sub{color:var(--brand-lavender);position:relative;}
.brand-hero .petal{position:absolute;pointer-events:none;overflow:visible;}
@media (max-width:600px){ .brand-hero .petal.p-far{display:none;} .brand-hero .petal{opacity:.55 !important;} }
.brand-hero .dot-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFFFFF;}

.toolbar{display:flex;gap:10px;}
input[type=text], input[type=date], input[type=time], textarea, select{
font-family:inherit;
font-size:14px;
color:var(--ink);
background:var(--surface);
border:1px solid var(--border);
border-radius:12px;
padding:10px 14px;
}
input[type=text]{border-radius:100px;flex:1;}
input:focus, textarea:focus, select:focus{outline:2px solid var(--accent);outline-offset:1px;}

button{
font-family:inherit;
font-size:14px;
font-weight:600;
border:none;
cursor:pointer;
border-radius:100px;
padding:10px 18px;
background:var(--surface-2);
color:var(--ink);
}
button.primary{background:var(--accent);color:var(--accent-ink);}
button.ghost{background:transparent;color:var(--muted);padding:6px 12px;}
button.ghost:hover{color:var(--ink);}
button:disabled{opacity:0.5;cursor:default;}

/* Tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);}
.tab-btn{
background:transparent;border-radius:10px 10px 0 0;padding:10px 16px;
color:var(--muted);font-weight:600;
}
.tab-btn.active{color:var(--ink);background:var(--surface);}
.panel{display:none;flex-direction:column;gap:18px;}
.panel.active{display:flex;}

/* Chips */
.chip-label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:0.02em;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
background:var(--surface);border:0.7px solid var(--border);color:var(--faint);
padding:7px 14px;font-size:13.5px;font-weight:500;
}
.chip.has-data{color:var(--ink);}
.chip.active{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-ink);font-weight:700;}

/* Feedback list */
.date-group{border-top:1px solid var(--border);}
.date-head{
display:flex;align-items:center;gap:8px;padding:14px 2px;cursor:pointer;
font-weight:700;color:var(--accent);
}
.date-head .count{color:var(--muted);font-weight:500;font-size:13px;}
.date-arrow{font-size:12px;width:14px;}
/* 년도·월 묶음 */
.year-group{display:flex;flex-direction:column;}
.year-head{
display:flex;align-items:center;gap:8px;padding:18px 2px 8px;cursor:pointer;
font-size:18px;font-weight:700;color:var(--ink);
}
.year-head .count, .month-head .count{color:var(--muted);font-weight:500;font-size:13px;}
.month-group{
background:var(--surface);border:1px solid var(--border);border-radius:14px;
margin:6px 0;overflow:hidden;
}
.month-head{
display:flex;align-items:center;gap:8px;padding:13px 16px;cursor:pointer;
font-size:15px;font-weight:700;color:var(--ink);
}
.month-head:hover, .year-head:hover{color:var(--accent);}
.month-body{padding:0 16px 6px;}
.month-body .date-group:first-child{border-top-color:var(--border);}
.month-body .date-head{padding:11px 2px;font-size:14.5px;}
.entries{display:flex;flex-direction:column;gap:14px;padding:0 2px 16px;}
.entry{
background:var(--surface);border:1px solid var(--border);border-radius:14px;
padding:16px 18px;box-shadow:var(--shadow);
}
.entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.entry-name{font-weight:700;font-size:15px;}
.entry-actions{display:flex;gap:4px;flex:none;}
.entry-actions button{padding:5px 10px;font-size:12.5px;font-weight:500;white-space:nowrap;}
.entry-text{white-space:pre-wrap;line-height:1.65;font-size:14px;color:var(--ink);}
.reply-box{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.reply{background:var(--surface-2);border-left:3px solid var(--brand-lavender);border-radius:10px;padding:9px 12px;margin-top:6px;}
.reply-head{display:flex;align-items:center;gap:8px;}
.reply-tag{font-size:11.5px;font-weight:700;color:var(--sage-ink);background:var(--sage-soft);border-radius:100px;padding:2px 9px;}
.reply-copy{margin-left:auto;padding:2px 8px !important;font-size:12px !important;font-weight:500 !important;}
.reply-del{padding:0 6px !important;font-size:14px !important;}
.reply-text{white-space:pre-wrap;font-size:13.5px;line-height:1.6;margin-top:5px;}

/* Add / edit form */
.form-card{
background:var(--surface);border:1px solid var(--border);border-radius:16px;
padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);
}
.form-title{font-weight:700;color:var(--accent);font-size:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.field textarea{width:100%;min-height:120px;resize:vertical;border-radius:12px;}
.field input{width:100%;}
.field select{width:100%;}
/* 창(모달) 안 입력칸이 밖으로 튀어나오지 않게 */
.modal-card{max-width:460px;overflow:hidden;}
.modal-card .form-row{flex-wrap:nowrap;}
.modal-card .form-row .field{min-width:0;}
.modal-card input, .modal-card select{max-width:100%;}
@media (max-width:420px){ .modal-card .form-row{flex-wrap:wrap;} .modal-card .form-row .field{flex:1 1 100%;} }
.form-row{display:flex;gap:12px;flex-wrap:wrap;}
.form-row .field{flex:1;min-width:140px;}
.form-actions{display:flex;justify-content:flex-end;gap:8px;}

/* Inline edit (within entry card) */
.entry.editing{display:flex;flex-direction:column;gap:12px;}
.entry.editing .field textarea{min-height:200px;}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;}
.cal-title{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{padding:6px 12px;}
.cal-grid{
display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;
}
.cal-dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px;}
.cal-cell{
position:relative;
border-radius:12px;background:var(--surface);border:1px solid var(--border);
padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-height:56px;
min-width:0;
}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.selected{background:var(--sage-soft);border-color:var(--sage);}
.cal-daynum{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);}
.cal-cell.today .cal-daynum{color:var(--accent);}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;}
.cal-add-btn{
position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;
background:var(--surface-2);color:var(--ink);border:none;cursor:pointer;
font-size:13px;line-height:1;font-weight:700;padding:0;display:flex;align-items:center;justify-content:center;
}
.cal-add-btn:hover{background:var(--ink);color:var(--surface);}
/* 달력: 한 주씩 그리드 (날짜 / 시험기간 띠 / 보강 목록) */
#cal-grid{display:flex;flex-direction:column;gap:6px;}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:6px;min-height:122px;}
.cal-week .cal-cell{min-height:0;padding:0;z-index:0;}
.cal-cell.other{background:transparent;}
.cal-week .cal-daynum{z-index:1;padding:6px 8px 3px;pointer-events:none;}
.cal-daynum.today{color:var(--accent);}
.cal-daynum.sun{color:var(--sun);}
.cal-daynum.other{opacity:.45;}
.cal-band{
z-index:1;margin:1px 3px;padding:0 7px;font-size:11px;font-weight:700;line-height:17px;border-radius:6px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
/* 시험 띠: 학교별 색 + 왼쪽 네이비 표시(시험 색)로 결석·보강 꼬리표와 구분 */
.cal-band{border-left:5px solid #2B2A4C;}
.cal-band.cont-l{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;border-left:none;}
.cal-band.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0;}
.cal-evs{z-index:1;pointer-events:none;padding:4px 5px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.cal-ev{font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-ev-t{font-weight:500;opacity:.75;}
.cal-ev.gwanli{background:var(--accent-soft);color:var(--accent);}
.cal-ev.gyeolseok{background:var(--absent-soft);color:var(--absent-ink);}
.cal-ev.jikjeon{background:var(--jikjeon-soft);color:var(--jikjeon-ink);}
.cal-ev.off{background:var(--surface-2);color:var(--sun);text-decoration:line-through;}
.cal-ev.more{background:transparent;color:var(--muted);font-weight:500;}
body.wide .wrap{max-width:1180px;}
@media (min-width:681px){ body.wide .bg-side-col{width:300px;} }
@media (max-width:520px){
.cal-week{min-height:74px;column-gap:3px;}
.cal-week .cal-daynum{padding:4px 4px 2px;font-size:11px;}
.cal-ev{font-size:9.5px;padding:0 3px;}
.cal-ev-t{display:none;}
.cal-band{font-size:9.5px;padding:0 3px;margin:1px;}
.cal-week .cal-add-btn{width:14px;height:14px;font-size:10px;top:2px;right:2px;opacity:.7;}
.cal-week .cal-daynum{padding-right:16px;}
}
/* 결석·보강 종류별 색 — 데스크 시간표 색 체계: 보강 파랑, 예약 노랑, 반이동 보라, 첫수업 초록 / 결석 빨강, 관리 핑크, 직보 주황, 시험 네이비 */
.k-absent{background:#FBE1E1 !important;color:#B3261E !important;}
.k-gwanli{background:#FFE0EC !important;color:#B8406E !important;}
.k-jikbo{background:#FDE3CC !important;color:#A44A0E !important;}
.k-bogang{background:#DCE7F8 !important;color:#2B4F8C !important;}
.k-yeyak{background:#FFF0B3 !important;color:#735300 !important;}
.k-move{background:#E7DBF7 !important;color:#5A3A8E !important;}
.k-first{background:#D6F0DC !important;color:#2A6A3B !important;}
.k-exam{background:#2B2A4C !important;color:#FFD9E8 !important;}
.cal-ev.k-absent{text-decoration:line-through;}
/* 일요일 빨간색 */
.cal-dow.sun, .cal-cell.sun .cal-daynum{color:var(--sun);}
/* 시험기간 표시 */
.cal-exams{display:flex;flex-direction:column;gap:2px;}
.cal-exam{
font-size:10px;font-weight:700;line-height:1.35;border-radius:5px;padding:1px 4px;
background:var(--exam-bg);color:var(--exam-ink);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 시간표 탭 */
.tt-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px 4px;}
.tt-grid{display:grid;grid-template-columns:repeat(6,minmax(104px,1fr));gap:8px;}
.tt-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 10px 12px;min-width:0;}
.tt-col.today{border-color:var(--accent);}
.tt-day{font-weight:700;font-size:14.5px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.tt-day span{color:var(--muted);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums;}
.tt-exams{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.tt-time{font-size:12px;font-weight:700;color:var(--accent);margin:10px 0 3px;}
.tt-time span{color:var(--faint);font-weight:500;}
.tt-name{font-size:13.5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:2px 0;}
.tt-tag{font-size:10px !important;padding:1px 6px !important;}
.tt-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.tt-name.editable{cursor:pointer;border-radius:6px;margin:0 -4px;padding:2px 4px;}
.tt-name.editable:hover{background:var(--surface-2);}
.tt-name.absent .tt-n{text-decoration:line-through;color:var(--faint);}
.tt-day{display:flex;align-items:center;gap:4px;}
.tt-add{
margin-left:auto;width:20px;height:20px;border-radius:50%;padding:0;
background:var(--surface-2);color:var(--ink);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.tt-add:hover{background:var(--ink);color:var(--surface);}
.tt-userbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);}
.tt-actions{display:flex;flex-direction:column;gap:8px;}
.tt-actions button{width:100%;}
.tt-log{display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5;}
.wait-head{display:inline-flex;align-items:center;gap:8px;font-size:14px;}
.wait-no{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:700;}
.wait-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.wait-actions input[type=date]{padding:4px 8px;font-size:12.5px;border-radius:8px;}
.wait-actions button{padding:4px 10px;font-size:12.5px;}
.exam-chip{
display:inline-block;font-size:11.5px;font-weight:700;border-radius:100px;padding:3px 9px;
background:var(--exam-bg);color:var(--exam-ink);white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;}
.dot.gwanli{background:var(--accent);}
.dot.gyeolseok{background:var(--absent);}
.dot.jikjeon{background:var(--jikjeon);}

.bg-layout{display:flex;align-items:flex-start;gap:16px;}
.bg-cal-col{flex:1 1 auto;min-width:0;}
.bg-side-col{flex:none;width:230px;}
.bg-side-panel{max-height:520px;overflow-y:auto;}
@media (max-width:680px){
.bg-layout{flex-direction:column;}
.bg-side-col{width:100%;}
.bg-side-panel{max-height:none;overflow-y:visible;}
}

.selected-date-title{font-size:15px;font-weight:700;}
.bogang-list{display:flex;flex-direction:column;gap:10px;}
.bogang-row{
display:flex;flex-direction:column;gap:8px;background:var(--surface);
border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);
}
.bogang-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.type-chip{
flex:none;font-size:11.5px;font-weight:700;border-radius:100px;padding:4px 10px;
}
.type-chip.gwanli{background:var(--accent-soft);color:var(--accent);}
.type-chip.gyeolseok{background:var(--absent-soft);color:var(--absent-ink);}
.type-chip.jikjeon{background:var(--jikjeon-soft);color:var(--jikjeon-ink);}
.bogang-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.bogang-name{font-weight:700;font-size:14.5px;}
.bogang-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.bogang-memo{font-size:13px;color:var(--muted);}
.empty-note{color:var(--faint);font-size:13.5px;padding:18px 2px;}

/* Student management */
.type-chip.done{background:var(--sage-soft);color:var(--sage-ink);}
.type-chip.late{background:var(--absent-soft);color:var(--absent-ink);}
.type-chip.off{background:var(--surface-2);color:var(--sun);}
.st-section{display:flex;flex-direction:column;gap:12px;}
.st-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.st-row-actions{display:flex;gap:2px;flex:none;}
.st-row-actions button{padding:4px 9px;font-size:12.5px;font-weight:500;white-space:nowrap;}
.st-kakao-text{box-sizing:border-box;width:100%;max-width:100%;min-width:0;display:block;min-height:220px;resize:vertical;border-radius:12px;line-height:1.65;font-size:14px;}
.st-details summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:4px 0;}
.st-details .entry-text{padding:6px 0 4px;}

<script>
// 최초 배포 시점의 학생 명단(마이그레이션용 기본값). 이후로는 명단 관리 UI에서
// 추가/삭제한 내용이 ROSTER_KEY에 저장되어 이 값을 대체하므로, 신규생/퇴원생이
// 생겨도 이 파일을 다시 손댈 필요가 없다.
const DEFAULT_STUDENTS = ["김리사","김유주","김이준","박하윤","배경윤","배은빈","서민경","엄승유","여채율","유소율","유이재","유지아","이서현","이아영","이아진","이준철","이준현","이채원B","이환","장서은","전윤아","전재우","정지현","최준서","최태훈","홍제인","황유찬"];
const FEEDBACK_KEY = 'kladi_feedback_archive_v1';
const BOGANG_KEY = 'kladi_bogang_v1';
const ROSTER_KEY = 'kladi_roster_v1';
const DOW = ['일','월','화','수','목','금','토'];

const loadObj = (key) => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch(e){ return {}; } };
const saveObj = (key, obj) => localStorage.setItem(key, JSON.stringify(obj));
const todayStr = () => new Date().toISOString().slice(0,10);
const uid = () => 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dowLabel = (dateStr) => DOW[new Date(dateStr+'T00:00:00').getDay()];

// ---------- 학생 명단(roster) ----------
// localStorage에 저장되어 브라우저에 남기 때문에, 신규생 추가·퇴원생 삭제는
// "명단 관리" 패널에서 바로 처리하고 GitHub 파일은 건드리지 않아도 된다.
function getRoster(){
try{
const raw = localStorage.getItem(ROSTER_KEY);
if(raw) return JSON.parse(raw);
}catch(e){}
// 최초 1회: 기본 명단으로 초기화
saveObj_roster(DEFAULT_STUDENTS.slice());
return DEFAULT_STUDENTS.slice();
}
function saveObj_roster(arr){
const sorted = Array.from(new Set(arr)).sort((a,b)=>a.localeCompare(b,'ko'));
localStorage.setItem(ROSTER_KEY, JSON.stringify(sorted));
return sorted;
}
function addStudent(name){
name = name.trim();
if(!name) return;
const roster = getRoster();
if(roster.includes(name)) return;
roster.push(name);
saveObj_roster(roster);
refreshDatalist();
}
function removeStudent(name){
const roster = getRoster().filter(n=>n!==name);
saveObj_roster(roster);
refreshDatalist();
}

// ---------- datalist for student names ----------
function refreshDatalist(){
let dl = document.getElementById('student-list');
if(!dl){
dl = document.createElement('datalist');
dl.id = 'student-list';
document.body.appendChild(dl);
}
dl.innerHTML = getRoster().map(s=>`<option value="${s}">`).join('');
}
refreshDatalist();

// ---------- 명단 관리 패널 ----------
function renderRosterPanel(){
const slot = document.getElementById('roster-panel-slot');
if(!slot.classList.contains('open')) return;
const roster = getRoster();
slot.innerHTML = `
<div class="form-card" style="margin:10px 0;">
<div class="form-title">학생 명단 관리</div>
<div class="modal-hint" style="margin:-4px 0 0;">여기서 추가·삭제한 내용은 이 브라우저에 바로 저장돼요. 삭제해도 그 학생의 예전 피드백·보강 기록은 사라지지 않고, "전체"에서 계속 볼 수 있어요.</div>
<div class="form-row">
<div class="field" style="flex:1;">
<input type="text" id="roster-add-input" placeholder="추가할 학생 이름">
</div>
<button class="primary" id="roster-add-btn">추가</button>
</div>
<div class="chips">
${roster.map(name=>`
<span class="chip has-data" style="display:inline-flex;align-items:center;gap:6px;">
${name}
<button class="roster-del-btn" data-name="${name}" title="명단에서 삭제" style="background:none;border:none;padding:0;margin:0;font-size:13px;line-height:1;color:var(--muted);cursor:pointer;border-radius:0;">×</button>
</span>`).join('')}
</div>
<div class="form-actions">
<button class="ghost" id="roster-manage-close">닫기</button>
</div>
</div>`;

document.getElementById('roster-manage-close').onclick = () => {
slot.classList.remove('open');
slot.innerHTML = '';
};
document.getElementById('roster-add-btn').onclick = () => {
const input = document.getElementById('roster-add-input');
addStudent(input.value);
renderRosterPanel();
renderFeedbackChips();
};
document.getElementById('roster-add-input').addEventListener('keydown', (e) => {
if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('roster-add-btn').click(); }
});
slot.querySelectorAll('.roster-del-btn').forEach(btn=>{
btn.onclick = () => {
const name = btn.dataset.name;
if(!confirm(`"${name}" 학생을 명단에서 삭제할까요? (이전 피드백·보강 기록은 유지됩니다)`)) return;
removeStudent(name);
renderRosterPanel();
renderFeedbackChips();
};
});
}
document.getElementById('roster-manage-open').onclick = () => {
const slot = document.getElementById('roster-panel-slot');
const willOpen = !slot.classList.contains('open');
slot.classList.toggle('open', willOpen);
if(willOpen) renderRosterPanel();
else slot.innerHTML = '';
};

// ================= TABS =================
document.querySelectorAll('.tab-btn').forEach(btn=>{
btn.addEventListener('click', ()=>{
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
btn.classList.add('active');
document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
document.body.classList.toggle('wide', btn.dataset.tab === 'bogang' || btn.dataset.tab === 'timetable');
if(btn.dataset.tab === 'bogang') renderBogang();
if(btn.dataset.tab === 'student') renderStudent();
if(btn.dataset.tab === 'timetable') renderTimetable();
});
});

// ================= FEEDBACK TAB =================
let fbFilter = null;
let fbSearch = '';
let fbOpenDates = new Set();
let fbYearState = {};  // 사용자가 직접 접거나 펼친 년도 { '2026': true/false }
let fbMonthState = {}; // 사용자가 직접 접거나 펼친 월 { '2026-11': true/false }
let fbEditingId = null;

function renderFeedbackChips(){
const data = loadObj(FEEDBACK_KEY);
const counts = {};
Object.values(data).forEach(e => counts[e.name] = (counts[e.name]||0) + 1);
const chips = document.getElementById('fb-chips');
chips.innerHTML = '';
const allChip = document.createElement('button');
allChip.className = 'chip has-data' + (fbFilter===null ? ' active' : '');
allChip.textContent = '전체';
allChip.onclick = () => { fbFilter = null; renderFeedbackChips(); renderFeedbackList(); };
chips.appendChild(allChip);
getRoster().forEach(name=>{
const c = document.createElement('button');
c.className = 'chip' + (counts[name] ? ' has-data' : '') + (fbFilter===name ? ' active' : '');
c.textContent = name;
c.onclick = () => { fbFilter = name; renderFeedbackChips(); renderFeedbackList(); };
chips.appendChild(c);
});
}

function renderFeedbackList(){
const data = loadObj(FEEDBACK_KEY);
const list = document.getElementById('fb-list');
let entries = Object.entries(data).map(([id,e])=>({id,...e}));
if(fbFilter) entries = entries.filter(e=>e.name===fbFilter);
if(fbSearch) entries = entries.filter(e=>e.name.includes(fbSearch));
const byDate = {};
entries.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
const dates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
list.innerHTML = '';
if(dates.length===0){ list.innerHTML = '<div class="empty-note">해당하는 피드백이 없어요.</div>'; return; }

// 년도 → 월 → 날짜로 묶는다. 기본으로는 가장 최근 년도·월만 펼치고,
// 학생 선택이나 검색 중일 때는 결과가 적으니 전부 펼친다.
const filtering = !!(fbFilter || fbSearch);
const latestYear = dates[0].slice(0,4);
const latestMonth = dates[0].slice(0,7);
const isYearOpen = (y) => (y in fbYearState) ? fbYearState[y] : (filtering || y === latestYear);
const isMonthOpen = (m) => (m in fbMonthState) ? fbMonthState[m] : (filtering || m === latestMonth);
const countIn = (ds) => ds.reduce((n,d)=>n+byDate[d].length, 0);

const byYear = {};
dates.forEach(d=>{
const y = d.slice(0,4), m = d.slice(0,7);
((byYear[y] = byYear[y]||{})[m] = byYear[y][m]||[]).push(d);
});

Object.keys(byYear).sort((a,b)=>b.localeCompare(a)).forEach(year=>{
const months = byYear[year];
const yOpen = isYearOpen(year);
const yGroup = document.createElement('div');
yGroup.className = 'year-group';
const yHead = document.createElement('div');
yHead.className = 'year-head';
const yDates = Object.values(months).flat();
yHead.innerHTML = `<span class="date-arrow">${yOpen?'▾':'▸'}</span> ${year}년 <span class="count">${countIn(yDates)}건</span>`;
yHead.onclick = () => { fbYearState[year] = !yOpen; renderFeedbackList(); };
yGroup.appendChild(yHead);
if(yOpen){
Object.keys(months).sort((a,b)=>b.localeCompare(a)).forEach(month=>{
const mOpen = isMonthOpen(month);
const mGroup = document.createElement('div');
mGroup.className = 'month-group';
const mHead = document.createElement('div');
mHead.className = 'month-head';
mHead.innerHTML = `<span class="date-arrow">${mOpen?'▾':'▸'}</span> ${parseInt(month.slice(5),10)}월 <span class="count">${months[month].length}일 · ${countIn(months[month])}건</span>`;
mHead.onclick = () => { fbMonthState[month] = !mOpen; renderFeedbackList(); };
mGroup.appendChild(mHead);
if(mOpen){
const mBody = document.createElement('div');
mBody.className = 'month-body';
months[month].forEach(date=> mBody.appendChild(buildFeedbackDateGroup(date, byDate[date])));
mGroup.appendChild(mBody);
}
yGroup.appendChild(mGroup);
});
}
list.appendChild(yGroup);
});
}

// 저장·수정한 날짜가 접힌 년도/월 안에 있어도 바로 보이도록 펼친다.
function fbRevealDate(date){
fbOpenDates.add(date);
fbYearState[date.slice(0,4)] = true;
fbMonthState[date.slice(0,7)] = true;
}

function buildFeedbackDateGroup(date, items){
const group = document.createElement('div');
group.className = 'date-group';
const open = fbOpenDates.has(date);
const head = document.createElement('div');
head.className = 'date-head';
head.innerHTML = `<span class="date-arrow">${open?'▾':'▸'}</span> ${date} (${dowLabel(date)}) <span class="count">${items.length}건</span>`;
head.onclick = () => { open ? fbOpenDates.delete(date) : fbOpenDates.add(date); renderFeedbackList(); };
group.appendChild(head);
if(open){
const wrap = document.createElement('div');
wrap.className = 'entries';
items.forEach(e=>{
wrap.appendChild(renderFeedbackEntry(e));
});
group.appendChild(wrap);
}
return group;
}

function renderFeedbackEntry(e){
const card = document.createElement('div');
card.className = 'entry';

if(fbEditingId === e.id){
card.classList.add('editing');
card.innerHTML = `
<div class="field">
<label>학생 이름</label>
<input type="text" class="inline-name" list="student-list" value="${e.name}">
</div>
<div class="field">
<label>날짜</label>
<input type="date" class="inline-date" value="${e.date}">
</div>
<div class="field">
<label>피드백 내용</label>
<textarea class="inline-text">${e.text}</textarea>
</div>
<div class="form-actions">
<button class="inline-cancel">취소</button>
<button class="primary inline-save">저장</button>
</div>
`;
card.querySelector('.inline-cancel').onclick = () => {
fbEditingId = null;
renderFeedbackList();
};
card.querySelector('.inline-save').onclick = () => {
const name = card.querySelector('.inline-name').value.trim();
const date = card.querySelector('.inline-date').value;
const text = card.querySelector('.inline-text').value.trim();
if(!name || !date || !text) return;
const data = loadObj(FEEDBACK_KEY);
data[e.id] = { name, date, text };
saveObj(FEEDBACK_KEY, data);
fbEditingId = null;
fbRevealDate(date);
renderFeedbackChips();
renderFeedbackList();
};
return card;
}

card.innerHTML = `
<div class="entry-head">
<span class="entry-name">${e.name}</span>
<span class="entry-actions">
<button class="ghost" data-act="copy">복사</button>
<button class="ghost" data-act="edit">수정</button>
<button class="ghost" data-act="delete">삭제</button>
</span>
</div>
<div class="entry-text"></div>
`;
card.querySelector('.entry-text').textContent = e.text;
const replies = repliesFor(e.id);
if(replies.length){
const box = document.createElement('div');
box.className = 'reply-box';
box.innerHTML = replies.map(r => `
<div class="reply">
<div class="reply-head"><span class="reply-tag">어머님 답장</span><span class="bogang-meta">${esc(r.date ? mdLabel(r.date) : '')} ${esc(r.time || '')}</span><button class="ghost reply-copy" data-reply-copy="${esc(r.id)}">복사</button><button class="ghost reply-del" data-reply-del="${esc(r.id)}" title="답장 지우기">×</button></div>
<div class="reply-text"></div>
</div>`).join('');
box.querySelectorAll('.reply-text').forEach((el, i) => { el.textContent = replies[i].text; });
box.querySelectorAll('[data-reply-copy]').forEach(btn => btn.onclick = () => {
const r = replies.find(x => x.id === btn.dataset.replyCopy);
if(r) copyToClipboard(r.text, btn);
});
box.querySelectorAll('[data-reply-del]').forEach(btn => btn.onclick = () => {
if(!confirm('이 답장을 지울까요?')) return;
const all = loadObj(REPLY_KEY); delete all[btn.dataset.replyDel]; saveObj(REPLY_KEY, all);
renderFeedbackList();
});
card.appendChild(box);
}
card.querySelector('[data-act=copy]').onclick = (ev) => {
const btn = ev.currentTarget;
const showResult = (ok) => {
const original = btn.textContent;
btn.textContent = ok ? '복사됨' : '복사 실패';
btn.disabled = true;
setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
};
const fallbackCopy = () => {
try {
const ta = document.createElement('textarea');
ta.value = e.text;
ta.style.position = 'fixed';
ta.style.opacity = '0';

// ---------- 어머님 답장 (카톡 답장 확인 예약 작업이 넣는다) ----------
// 저장: kladi_parent_replies_v1 = { id: { name, feedbackId, date, time, text, addedAt } }
const REPLY_KEY = 'kladi_parent_replies_v1';
function repliesFor(feedbackId){
return Object.entries(loadObj(REPLY_KEY)).map(([id, r]) => ({ id, ...r }))
.filter(r => r.feedbackId === feedbackId)
.sort((a,b) => ((a.date || '') + (a.addedAt || '')).localeCompare((b.date || '') + (b.addedAt || '')));
}
// 예약 작업이 크롬에서 호출: kladiAddParentReply("유지아", "답장 원문", "오전 11:01", "2026-11-06")
// 그 학생의 피드백 중 답장 날짜 이전(같은 날 포함)의 가장 최근 피드백 아래에 붙인다.
window.kladiAddParentReply = (name, text, time, date) => {
name = String(name || '').trim(); text = String(text || '').trim();
if(!name || !text) return JSON.stringify({ status: 'error', reason: '이름 또는 내용 없음' });
date = date || localToday();
const fb = Object.entries(loadObj(FEEDBACK_KEY)).map(([id, e]) => ({ id, ...e }));
let target = fb.filter(e => e.name === name);
// 카톡방 이름이 명단과 조금 다를 때(예: 이채원 ↔ 이채원B) 앞부분이 같은 이름으로 찾는다
if(!target.length) target = fb.filter(e => e.name.startsWith(name) || name.startsWith(e.name));
target = target.filter(e => e.date <= date).sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
const all = loadObj(REPLY_KEY);
if(Object.values(all).some(r => r.text === text && (r.name === name || (target[0] && r.feedbackId === target[0].id)))){
return JSON.stringify({ status: 'duplicate', name });
}
if(!target.length) return JSON.stringify({ status: 'no-feedback', name });
all[uid()] = { name: target[0].name, feedbackId: target[0].id, date, time: time || '', text, addedAt: new Date().toISOString() };
saveObj(REPLY_KEY, all);
fbRevealDate(target[0].date);
renderFeedbackList();
return JSON.stringify({ status: 'added', name: target[0].name, feedbackDate: target[0].date });
};

// ---------- 보강 키워드 감지 (피드백 저장 시) ----------
// "관리보강" / "결석보강" / "직전보강"(또는 "직보") 이라는 단어가 있으면 후보로 인식한다.
// 글 안에 "N월 N일" 형식의 날짜가 있으면 그 날짜를, 없으면(예: "최태훈 결석보강"처럼 짧게만 쓴 경우)
// 그 피드백 항목 자체의 날짜(refDateStr)를 그대로 사용한다.
function detectBogangCandidate(text, refDateStr){
let type = null;
if(text.includes('직전보강') || text.includes('직보')) type = '직전보강';
else if(text.includes('결석보강')) type = '결석보강';
else if(text.includes('관리보강')) type = '관리보강';
if(!type) return null;

const dateMatch = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
let date;
if(dateMatch){
const month = String(dateMatch[1]).padStart(2,'0');
const day = String(dateMatch[2]).padStart(2,'0');
const year = (refDateStr || todayStr()).slice(0,4);
date = `${year}-${month}-${day}`;
} else {
date = refDateStr || todayStr();
}

let time = '';
const halfMatch = text.match(/(\d{1,2})\s*시\s*반/);
const hmMatch = text.match(/(\d{1,2})\s*시\s*(\d{1,2})\s*분/);
const hOnlyMatch = !hmMatch && !halfMatch ? text.match(/(\d{1,2})\s*시(?!간)/) : null;
let hour = null, minute = 0;
if(halfMatch){ hour = parseInt(halfMatch[1],10); minute = 30; }
else if(hmMatch){ hour = parseInt(hmMatch[1],10); minute = parseInt(hmMatch[2],10); }
else if(hOnlyMatch){ hour = parseInt(hOnlyMatch[1],10); minute = 0; }
if(hour !== null){
if(hour >= 1 && hour <= 7 && !text.includes('오전')) hour += 12; // 학원 특성상 오후로 간주
time = `${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;
}

return { type, date, time };
}

let calCursor = new Date(); calCursor.setDate(1);
let selectedDate = todayStr();

let bgRangeMode = 'all'; // 'all' | 'month' | 'custom'
let bgRangeStart = '';
let bgRangeEnd = '';

function bgFilterActive(){

}

function bogangTypeClass(type){ return kindCls(type); }

// 학교별 시험기간 색 (배경, 글자). 목록에 없는 학교는 이름으로 남은 색 중 하나를 고른다.
const SCHOOL_COLORS = {
'서일중': ['#D9F0E3','#2D6A4A'], '원촌중': ['#FCE3C8','#7A4316'], '이수중': ['#E3DAF5','#4B3F78'],
'서초중': ['#D8E8F7','#2E5A85'], '세화여중': ['#FFD9E8','#9C2D5A'], '서문여중': ['#FADBD3','#8A3B2A'],
'동덕여중': ['#F3DDF0','#7A2E6E'], '신반포중': ['#FCEBC7','#7A5A12'], '경원중': ['#D6EEF0','#1F6168'],
'예원중': ['#DCE0F5','#33407A'], '서운중': ['#DDE7D0','#4D5F2E'], '동작중': ['#E8E4DA','#5A4E3A'], '방배중': ['#F7E1CC','#7A4A16'],
};
const EXTRA_COLORS = [['#E9E0F7','#4B3F78'],['#D3ECE8','#1F5E55'],['#FBE0E6','#8A2E48'],['#E2E8D3','#4A5A26'],['#F5E6CF','#6E4C14'],['#DCE6F4','#2E4E7A']];
function schoolColor(school){
if(SCHOOL_COLORS[school]) return SCHOOL_COLORS[school];
let h = 0; for(const ch of String(school)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
return EXTRA_COLORS[h % EXTRA_COLORS.length];
}
const examStyle = (x) => { const [bg, ink] = schoolColor(x.school); return `background:${bg};color:${ink};`; };

// 보강 목록: 공유 시간표에 로그인했으면 클라우드의 결석·보강, 아니면 이 브라우저의 보강 기록
function getBogangEntries(){
if(cloudOn()){
return Object.entries(cloudData.changes).map(([id,c]) => ({
id, cloud: true, name: c.name, type: c.kind, date: c.date, time: c.time || '', by: c.by || '',
memo: [c.absentDate ? `${mdLabel(c.absentDate)} 결석분` : '', c.note || ''].filter(Boolean).join(' · ')
}));
}
return Object.entries(loadObj(BOGANG_KEY)).map(([id,b]) => ({ id, ...b }));
}

function getBogangRangeBounds(){
if(bgRangeMode === 'month'){
const now = new Date();
const start = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
const end = fmtDate(new Date(now.getFullYear(), now.getMonth()+1, 0));
return { start, end };
}
if(bgRangeMode === 'custom'){
return { start: bgRangeStart || null, end: bgRangeEnd || null };
}
return { start: null, end: null };
}

function renderCalDow(){
const el = document.getElementById('cal-dow');
el.innerHTML = DOW.map((d,i)=>`<div class="cal-dow${i===0?' sun':''}">${d}</div>`).join('');
}

// 한 주를 한 줄(그리드)로 그린다: 1행 날짜 숫자, 그 아래 시험기간 띠(겹치면 여러 줄), 맨 아래 보강 목록
function renderCalendar(){
const y = calCursor.getFullYear(), m = calCursor.getMonth();
document.getElementById('cal-title').textContent = `${y}년 ${m+1}월`;
const byDate = {};
getBogangEntries().forEach(b => { (byDate[b.date] = byDate[b.date] || []).push(b); });
Object.values(byDate).forEach(list => list.sort((a,b) => (a.time||'99').localeCompare(b.time||'99')));
const exams = examList();
const today = localToday();

const grid = document.getElementById('cal-grid');
grid.innerHTML = '';
const first = new Date(y, m, 1);
const lastDay = new Date(y, m + 1, 0);
const wk = new Date(first); wk.setDate(1 - first.getDay());
while(wk <= lastDay){
const days = [...Array(7)].map((_, i) => { const d = new Date(wk); d.setDate(d.getDate() + i); return d; });
const ds = days.map(fmtDate);
// 이 주에 걸치는 시험기간을 잘라서 띠로 만들고, 겹치지 않게 줄(lane)을 나눈다
const segs = exams.filter(x => x.start <= ds[6] && (x.end || x.start) >= ds[0]).map(x => {
const endDate = x.end || x.start;
return { x, s: x.start < ds[0] ? 0 : ds.indexOf(x.start), e: endDate > ds[6] ? 6 : ds.indexOf(endDate), contL: x.start < ds[0], contR: endDate > ds[6] };
}).sort((a,b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
const lanes = [];
segs.forEach(sg => { let l = lanes.findIndex(end => end < sg.s); if(l < 0){ l = lanes.length; lanes.push(-1); } lanes[l] = sg.e; sg.lane = l; });
const L = lanes.length;

const week = document.createElement('div');
week.className = 'cal-week';
week.style.gridTemplateRows = `auto${L ? ` repeat(${L}, 19px)` : ''} 1fr`;
const evRow = L + 2;
days.forEach((d, i) => {
const dateStr = ds[i];
const inMonth = d.getMonth() === m;
const cell = document.createElement('div');
cell.className = 'cal-cell' + (inMonth ? '' : ' other') + (dateStr === today ? ' today' : '') + (dateStr === selectedDate ? ' selected' : '') + (d.getDay() === 0 ? ' sun' : '');
cell.style.gridColumn = `${i + 1}`;
cell.style.gridRow = '1 / -1';
cell.innerHTML = `<button class="cal-add-btn" title="이 날짜에 보강 등록">+</button>`;
cell.onclick = () => { selectedDate = dateStr; renderCalendar(); renderBogangList(); };
cell.querySelector('.cal-add-btn').onclick = (ev) => {
ev.stopPropagation();
selectedDate = dateStr;
renderCalendar(); renderBogangList();
if(cloudOn()) openAddChange({ date: dateStr }); else openBogangForm(null);
};
week.appendChild(cell);

const num = document.createElement('div');
num.className = 'cal-daynum' + (d.getDay() === 0 ? ' sun' : '') + (inMonth ? '' : ' other') + (dateStr === today ? ' today' : '');
num.style.gridColumn = `${i + 1}`; num.style.gridRow = '1';
num.textContent = d.getDate();
week.appendChild(num);

const items = byDate[dateStr] || [];
if(items.length){
const ev = document.createElement('div');
ev.className = 'cal-evs';
ev.style.gridColumn = `${i + 1}`; ev.style.gridRow = `${evRow}`;
const MAX = 4;
ev.innerHTML = items.slice(0, MAX).map(b => `<div class="cal-ev ${bogangTypeClass(b.type)}" title="${esc(b.type)} ${esc(b.name)} ${esc(b.time || '')}"><span class="cal-ev-t">${b.time ? esc(fmtT(b.time)) : ''}</span> ${b.name ? esc(b.name) : '예약'}${b.type === '반이동' || b.type === '첫수업' ? ' · ' + esc(kindShort(b.type)) : ''}</div>`).join('')
+ (items.length > MAX ? `<div class="cal-ev more">+${items.length - MAX}건</div>` : '');
week.appendChild(ev);
}
});
segs.forEach(sg => {
const band = document.createElement('div');
band.className = 'cal-band' + (sg.contL ? ' cont-l' : '') + (sg.contR ? ' cont-r' : '');
band.style.cssText = examStyle(sg.x) + `grid-column:${sg.s + 1} / ${sg.e + 2};grid-row:${sg.lane + 2};`;
band.title = examLabel(sg.x) + (sg.x.memo ? ' · ' + sg.x.memo : '');
band.textContent = `${sg.x.school}${sg.x.grades && sg.x.grades.length ? ' ' + sg.x.grades.join('·') + '학년' : ''} ${sg.x.name.replace('2학기 ', '').replace('1학기 ', '')}`;
band.onclick = () => { selectedDate = ds[sg.s]; renderCalendar(); renderBogangList(); };
week.appendChild(band);
});
grid.appendChild(week);
wk.setDate(wk.getDate() + 7);
}
}

function copyToClipboard(text, btn){
const showResult = (ok) => {
const original = btn.textContent;
btn.textContent = ok ? '복사됨' : '복사 실패';
btn.disabled = true;
setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
};
const fallback = () => {
try{
const ta = document.createElement('textarea');
ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
document.body.appendChild(ta); ta.focus(); ta.select();
const ok = document.execCommand('copy');
document.body.removeChild(ta);
showResult(ok);
}catch(err){ showResult(false); }
};
if(navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(() => showResult(true)).catch(fallback);
}else{ fallback(); }
}

function buildKakaoText(name, rangeKey){
const d = getStudentData(name);
const today = localToday();
let plans = d.plans.filter(p => !p.done && p.date >= today);
if(rangeKey !== 'all'){
const limit = new Date(); limit.setDate(limit.getDate() + parseInt(rangeKey, 10));
const limitStr = fmtDate(limit);
plans = plans.filter(p => p.date <= limitStr);
}
plans.sort((a,b) => a.date.localeCompare(b.date));
if(plans.length === 0) return '';
const lines = [];
// 카톡 피드백과 같은 형식: "안녕하세요, 어머님~"으로 시작해 도입 문구 없이 바로 본문, 학생 이름은 넣지 않고, "감사합니다."로 마무리
lines.push('안녕하세요, 어머님~');
if(d.books.length){
lines.push('■ 진행 교재');
d.books.forEach(b => lines.push(`- ${b.title}`));
lines.push('');
}
lines.push('■ 진도 계획');
plans.forEach(p => {
const head = shortDate(p.date);
const body = [p.book, p.content].filter(Boolean).join(' ');
lines.push(`${head} ${body}`.trim());
if(p.memo) lines.push(`  ※ ${p.memo}`);
});
lines.push('');
lines.push('감사합니다.');
return lines.join('\n');
}

function backupCardHtml(){
return `

<div class="form-actions">
<button id="st-export">내보내기</button>
<button id="st-import">불러오기</button>
<input type="file" id="st-import-file" accept="application/json,.json" style="display:none;">
</div>
</div>`;
}

function bindBackup(){
document.getElementById('st-export').onclick = () => {
const out = {};
BACKUP_KEYS.forEach(k => { const v = localStorage.getItem(k); if(v) out[k] = JSON.parse(v); });
const blob = new Blob([JSON.stringify({ app: 'kladi-feedback-archive', savedAt: new Date().toISOString(), data: out }, null, 2)], {type:'application/json'});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = `kladi-backup-${localToday()}.json`;
document.body.appendChild(a); a.click(); a.remove();
setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const fileInput = document.getElementById('st-import-file');
document.getElementById('st-import').onclick = () => fileInput.click();
fileInput.onchange = () => {
const f = fileInput.files[0];
if(!f) return;
importBackupFile(f);
fileInput.value = '';
};
}

// 백업 파일·시간표 파일 공통 불러오기 (파일에 들어 있는 항목만 바꾼다)
function importBackupFile(f){
const reader = new FileReader();
reader.onload = () => {
try{
const parsed = JSON.parse(reader.result);
if(!parsed || parsed.app !== 'kladi-feedback-archive' || typeof parsed.data !== 'object') throw new Error('형식 오류');
const keysInFile = Object.keys(parsed.data).filter(k => BACKUP_KEYS.includes(k));
const onlyTimetable = keysInFile.length && keysInFile.every(k => k === 'kladi_timetable_v1' || k === 'kladi_exams_v1');
const msg = onlyTimetable
? '시간표 파일이에요. 시간표만 새 내용으로 바뀌고, 피드백·보강·진도 기록은 그대로 남아요. 불러올까요?'
: '이 브라우저의 기존 데이터가 파일 내용으로 바뀝니다. 계속할까요?';
if(!confirm(msg)) return;
BACKUP_KEYS.forEach(k => {
if(parsed.data[k] !== undefined) localStorage.setItem(k, JSON.stringify(parsed.data[k]));
});
location.reload();
}catch(err){ alert('백업 파일을 읽지 못했어요. 이 사이트에서 내보낸 파일이 맞는지 확인해주세요.'); }
};
reader.readAsText(f);
}

document.getElementById('st-body').addEventListener('click', (ev) => {
const el = ev.target.closest('[data-act]');
if(!el || !stName) return;
const act = el.dataset.act, id = el.dataset.id;
const d = getStudentData(stName);

if(act === 'book-add'){
const input = document.getElementById('st-book-input');
const title = input.value.trim();
if(!title || d.books.some(b => b.title === title)) return;
d.books.push({ id: uid(), title });
saveStudentData(stName, d); renderStudent();
}else if(act === 'book-del'){
const b = d.books.find(x => x.id === id);
if(!b || !confirm(`"${b.title}" 교재를 목록에서 삭제할까요? (이미 입력한 진도 계획은 그대로 남아요)`)) return;
d.books = d.books.filter(x => x.id !== id);
saveStudentData(stName, d); renderStudent();
}else if(act === 'plan-new'){
stEditingPlanId = 'new'; renderStudent();
}else if(act === 'plan-edit'){
stEditingPlanId = id; renderStudent();
}else if(act === 'plan-cancel'){
stEditingPlanId = null; renderStudent();
}else if(act === 'plan-save'){
const date = document.getElementById('st-p-date').value;
const book = document.getElementById('st-p-book').value.trim();
const content = document.getElementById('st-p-content').value.trim();
const memo = document.getElementById('st-p-memo').value.trim();
if(!date || (!book && !content)) return;

const obj = {};
DEFAULT_EXAMS.forEach((x,i) => { obj['exam_' + i] = { ...x }; });
saveObj(EXAM_KEY, obj);
return obj;
}
function examList(){
return Object.entries(getExams()).map(([id,x]) => ({ id, ...x })).sort((a,b) => a.start.localeCompare(b.start));
}
function examsOn(date){ return examList().filter(x => x.start <= date && date <= (x.end || x.start)); }
const shortSchool = (s) => String(s || '').replace(/(여중|중|학교)$/, '');
const mdLabel = (s) => { const p = s.split('-'); return `${+p[1]}/${+p[2]}(${dowLabel(s)})`; };
function examTarget(x){ return `${x.school}${x.grades && x.grades.length ? ' ' + x.grades.join('·') + '학년' : ''}`; }
function examLabel(x){ return `${examTarget(x)} ${x.name} ${mdLabel(x.start)}${x.end && x.end !== x.start ? '~' + mdLabel(x.end) : ''}`; }
function examMatches(x, s){ return !!s && s.school === x.school && (!x.grades || !x.grades.length || x.grades.includes(s.grade)); }

// 두 가지 방식으로 동작한다.
// 1) 로그인 전(이 컴퓨터만): 정리된 시간표 파일을 "불러오기"로 넣고 보기만 한다.
// 2) 로그인 후(공유 시간표, Firebase): 박유경T·데스크가 같은 시간표를 보고 고친다. 바뀐 내용은 바로 서로의 화면에 반영된다.
//    - students/{이름}: 정규 시간표 { label, school, grade, slots:[{day(1=월..6=토), time, from?, until?}], wait }
//    - changes/{id}:   날짜별 변경 { date, time, name, kind('결석'|'관리보강'|'결석보강'|'직전보강'|'보강'), note, absentDate?, by, at }
//    - exams/{id}:     시험기간,  log/{id}: 변경 기록 { at, by, text },  staff/{이메일}: 데스크 계정 { name }
const TIMETABLE_KEY = 'kladi_timetable_v1';
const TEACHER_EMAIL = 'yuuuukk77@gmail.com';
const TEACHER_NAME = '박유경T';
const MAKEUP_KINDS = ['관리보강', '결석보강', '직전보강'];

let cloudUser = null;      // { email }

let cloudUnsubs = [];

const cloudOn = () => !!(cloud && cloudUser && cloudData.students);

? { students: cloudData.students, extras: [], source: '공유 시간표', updatedAt: '' }
: loadObj(TIMETABLE_KEY);
const ttStudents = () => getTimetable().students || {};
const fmtT = (t) => {
if(!t) return '';
let [h, m] = t.split(':').map(Number);
if(h > 12) h -= 12;
return `${h}시${m === 30 ? ' 반' : (m ? ' ' + m + '분' : '')}`;
};
const slotActive = (slot, date) => (!slot.from || date >= slot.from) && (!slot.until || date <= slot.until);
function studentTabNames(){

Object.entries(ttStudents()).forEach(([n,s]) => { if(s.slots && s.slots.length) names.add(n); });
return Array.from(names).sort((a,b) => a.localeCompare(b,'ko'));
}

// ---------- Firebase 연결 ----------
window.kladiCloudInit = (api, err) => {
cloud = api || null;
cloudError = err ? String(err) : '';
if(!cloud){ renderTimetableIfOpen(); return; }
cloud.onAuth(user => {
cloudUnsubs.forEach(u => { try{ u(); }catch(e){} });
cloudUnsubs = [];
cloudData = { students: null, changes: {}, exams: null, log: {}, staff: {} };
cloudDenied = false;
cloudUser = user ? { email: (user.email || '').toLowerCase() } : null;
cloudRole = cloudUser ? (cloudUser.email === TEACHER_EMAIL ? 'teacher' : 'desk') : null;
applyRoleUI();
if(cloudUser){
const onErr = (e) => { cloudDenied = true; console.warn(e); renderTimetableIfOpen(); };
const watch = (col, key) => cloudUnsubs.push(cloud.watch(col, (data) => {
cloudData[key] = data;
renderTimetableIfOpen();
if(key === 'exams' || key === 'students') refreshOtherViews();
}, onErr));
watch('students', 'students');
watch('changes', 'changes');
watch('exams', 'exams');
watch('log', 'log');
watch('staff', 'staff');
}
renderTimetableIfOpen();
});
};

${s.wait ? `<div class="modal-hint">대기·희망: ${esc(s.wait)}</div>` : ''}

const KIND_CLASS = { '결석': 'k-absent', '관리보강': 'k-gwanli', '직전보강': 'k-jikbo', '결석보강': 'k-bogang', '보강': 'k-bogang', '예약': 'k-yeyak', '반이동': 'k-move', '첫수업': 'k-first' };
const kindCls = (k) => KIND_CLASS[k] || 'k-gwanli';
const kindShort = (k) => ({ '관리보강': '관리', '결석보강': '보강', '직전보강': '직보', '보강': '보강', '결석': '결석', '예약': '예약', '반이동': '반이동', '첫수업': '첫수업' }[k] || k);
// 추가 창의 종류 목록 (값, 표시 이름)
const CHANGE_KINDS = [['결석','결석'],['결석보강','보강'],['관리보강','관리'],['직전보강','직보'],['예약','예약'],['반이동','반이동'],['첫수업','첫수업']];
const displayName = (e) => e.name || (e.memo ? `자리 예약 · ${e.memo}` : '자리 예약');

// ----- 시간표 탭: 한 주 단위로 정규 수업 + 결석·보강을 합쳐서 보여준다 -----
let ttWeekStart = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; })();
let ttEditOpen = false;
let ttEditStudent = '';

function dayEntries(dateStr, dow){
const tt = getTimetable();
const students = tt.students || {};
const out = [];
if(cloudOn()){
const changes = Object.entries(cloudData.changes).map(([id,c]) => ({ id, ...c })).filter(c => c.date === dateStr);
Object.entries(students).forEach(([name, s]) => {
s.slots.forEach(x => {
if(x.day !== dow || !slotActive(x, dateStr)) return;
const absent = changes.find(c => c.kind === '결석' && c.name === name && (!c.time || c.time === x.time));
out.push({ name, time: x.time, kind: '정규', absent: absent || null });
});
});
changes.filter(c => c.kind !== '결석').forEach(c => {
// 반이동·첫수업 날 정규 수업으로도 등록돼 있으면 같은 줄에 꼬리표만 붙인다
const same = (c.kind === '반이동' || c.kind === '첫수업') && out.find(o => o.kind === '정규' && o.name === c.name && o.time === (c.time || ''));
if(same){ same.tag = c.kind; same.change = c; return; }
out.push({ name: c.name, time: c.time || '', kind: c.kind, memo: c.note, change: c });
});
// 정규 수업이 없는 날에 잡힌 결석 기록도 보이게
changes.filter(c => c.kind === '결석' && !out.some(o => o.absent && o.absent.id === c.id))
.forEach(c => out.push({ name: c.name, time: c.time || '', kind: '정규', absent: c }));
}else{
Object.entries(students).forEach(([name, s]) => {
s.slots.forEach(x => { if(x.day === dow && slotActive(x, dateStr)) out.push({ name, time: x.time, kind: '정규' }); });
});
const bogang = Object.values(loadObj(BOGANG_KEY)).filter(b => b.date === dateStr);
bogang.forEach(b => out.push({ name: b.name, time: b.time || '', kind: b.type, memo: b.memo }));
(tt.extras || []).filter(e => e.date === dateStr).forEach(e => {
if(!bogang.some(b => b.name === e.name)) out.push({ name: e.name, time: e.time, kind: '보강', memo: e.note ? e.note + '보강' : '' });
});
}
const exams = examsOn(dateStr);
out.forEach(o => { o.exam = exams.some(x => examMatches(x, students[o.name])); });
return out;
}

'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않아요. Gmail 비밀번호가 아니라 Firebase 사용자 추가 때 정한 비밀번호예요.',

'auth/invalid-login-credentials': '이메일 또는 비밀번호가 맞지 않아요. Firebase 사용자 추가 때 정한 비밀번호예요.',
'auth/user-not-found': '이 이메일로 만든 계정이 없어요. Firebase → Authentication → 사용자(Users)에서 추가해 주세요.',
'auth/invalid-email': '이메일 형식이 맞지 않아요.',

'auth/unauthorized-domain': '이 사이트 주소가 허용되지 않았어요. Authentication → 설정 → 승인된 도메인에 agfdch.github.io를 추가해 주세요.',

go.disabled = false;

};
kindSel.onchange = syncKind; syncKind();
timeSel.onchange = () => { ov.querySelector('#tc-time-custom').style.display = timeSel.value === '__custom' ? '' : 'none'; };
ov.querySelector('#tc-cancel').onclick = close;
ov.querySelector('#tc-save').onclick = async () => {
const name = ov.querySelector('#tc-name').value.trim();
const kind = kindSel.value;
const date = ov.querySelector('#tc-date').value;
const time = timeSel.value === '__custom' ? ov.querySelector('#tc-time-custom').value : timeSel.value;
const note = ov.querySelector('#tc-note').value.trim();
const absentDate = p.absentDate || (kind === '결석보강' ? ov.querySelector('#tc-absent').value : '');
if((!name && kind !== '예약') || !date){ alert(kind === '예약' ? '날짜를 입력해 주세요.' : '학생과 날짜를 입력해 주세요.'); return; }
const at = new Date().toISOString();
close();
// 반이동·첫수업: 이 날부터 매주 정규 수업으로 등록 (시간표에 없는 학생이면 새로 만든다)
if((kind === '반이동' || kind === '첫수업') && ov.querySelector('#tc-regular').checked){
const dow = new Date(date + 'T00:00:00').getDay();
const cur = ttStudents()[name];
const label = ov.querySelector('#tc-label').value.trim();
const m = label.match(/^(.+?)(\d)$/);
const base = cur ? { ...cur } : { label, school: m ? m[1] : label, grade: m ? +m[2] : null, slots: [], wait: '' };
if(!(base.slots || []).some(x => x.day === dow && x.time === time)){
base.slots = [...(base.slots || []), { day: dow, time, from: date }].sort((a,b) => a.day - b.day || a.time.localeCompare(b.time));
await cloudWrite(() => cloud.set('students', name, { ...base, updatedAt: at, updatedBy: myName() }), `${name} 정규 수업 등록: ${DOW[dow]} ${fmtT(time)} (${mdLabel(date)}부터, ${kind})`);
}
}
// 빠진 수업 날짜를 적었고 아직 결석 기록이 없으면 결석도 함께 남긴다
if(absentDate && !p.absentDate && !Object.values(cloudData.changes).some(c => c.kind === '결석' && c.name === name && c.date === absentDate)){
const s = ttStudents()[name];
const dow = new Date(absentDate + 'T00:00:00').getDay();
const slot = s && s.slots.find(x => x.day === dow && slotActive(x, absentDate));
await cloudWrite(() => cloud.add('changes', { date: absentDate, time: slot ? slot.time : '', name, kind: '결석', note: '', by: myName(), at }), `${name} ${mdLabel(absentDate)} 결석`);
}
const doc = { date, time, name, kind, note, by: myName(), at };
if(absentDate) doc.absentDate = absentDate;
await cloudWrite(() => cloud.add('changes', doc), `${name || '자리'} ${kind} ${mdLabel(date)} ${fmtT(time)}${absentDate ? ` (${mdLabel(absentDate)} 결석분)` : ''}${note ? ' · ' + note : ''}`);
};
});
}

if((!name && kind !== '예약') || !date){ alert('학생과 날짜를 입력해 주세요.'); return; }

${editable ? `

function bindWaitlist(){
const students = ttStudents();
const save = (name, data, text) => cloudWrite(() => cloud.set('students', name, { ...data, updatedAt: new Date().toISOString(), updatedBy: myName() }), text);
document.querySelectorAll('[data-wait-date]').forEach(inp => inp.onchange = async () => {

const timePart = s.waitAt && s.waitAt.length > 10 ? s.waitAt.slice(10) : 'T12:00:00.000Z';
await save(name, { ...s, waitAt: inp.value + timePart }, `${name} 대기 등록일 → ${mdLabel(inp.value)}`);
});
document.querySelectorAll('[data-wait-done]').forEach(btn => btn.onclick = async () => {
const name = btn.dataset.waitDone; const s = students[name];
if(!s || !confirm(`${name} 학생을 대기 명단에서 뺄까요?`)) return;
if(!(s.slots || []).length){
await cloudWrite(() => cloud.remove('students', name), `${name} 대기 해제`);
}else{
await save(name, { ...s, wait: '', waitAt: '' }, `${name} 대기 해제`);
}
});
const add = document.getElementById('wt-add');
if(add) add.onclick = async () => {
const name = document.getElementById('wt-name').value.trim();
const memo = document.getElementById('wt-memo').value.trim();
if(!name || !memo){ alert('이름과 희망 내용을 입력해 주세요.'); return; }
const cur = students[name];
const label = document.getElementById('wt-label').value.trim();
const m = label.match(/^(.+?)(\d)$/);
const base = cur ? { ...cur } : { label, school: m ? m[1] : label, grade: m ? +m[2] : null, slots: [] };
const waitAt = cur && cur.wait && cur.waitAt ? cur.waitAt : new Date().toISOString();
await save(name, { ...base, wait: memo, waitAt }, `${name} 대기 등록: ${memo}`);
};
}

function bindStaffCard(){
const add = document.getElementById('sf-add');
if(!add) return;
add.onclick = async () => {
const email = document.getElementById('sf-email').value.trim().toLowerCase();
const name = document.getElementById('sf-name').value.trim() || '데스크';
if(!email || !email.includes('@')){ alert('이메일을 확인해 주세요.'); return; }
await cloudWrite(() => cloud.set('staff', email, { name }), `데스크 계정 등록: ${name}`);
};
document.querySelectorAll('[data-staff-del]').forEach(b => b.onclick = async () => {
if(!confirm(`${b.dataset.staffDel} 계정의 시간표 권한을 없앨까요?`)) return;
await cloudWrite(() => cloud.remove('staff', b.dataset.staffDel), `데스크 계정 삭제: ${b.dataset.staffDel}`);
});
}

set: (col, id, data) => fs.setDoc(fs.doc(db, col, id), data),
add: (col, data) => fs.addDoc(fs.collection(db, col), data).then(r => r.id),
