<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학부모 피드백 모음 · 클라디수학학원</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
  }
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap');

  :root{
    --paper: #fbf6ee;
    --ink: #2c2416;
    --ink-soft: #6b6152;
    --rule: #e6dcc8;
    --accent: #d97a2e;
    --accent-deep: #a85a1e;
    --sage: #74805f;
    --sage-bg: #eef0e6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ece4d4;
    font-family: 'Pretendard', -apple-system, sans-serif;
    color: var(--ink);
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  .layout {
    display: flex;
    align-items: flex-start;
    gap: 28px;
  }

  .sidebar {
    width: 168px;
    flex-shrink: 0;
    position: sticky;
    top: 24px;
  }

  .sidebar-title {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 8px;
    padding-left: 10px;
  }

  .student-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .student-item {
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    text-align: left;
    font-family: 'Pretendard', sans-serif;
  }
  .student-item:hover { color: var(--accent-deep); background: var(--sage-bg); }
  .student-item.active { background: var(--sage-bg); color: var(--accent-deep); font-weight: 700; }
  .student-item.no-entry { color: #c2b8a3; }
  .student-item.no-entry:hover { color: var(--accent-deep); }

  .main-col { flex: 1; min-width: 0; }

  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      position: static;
    }
    .student-list {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 6px;
    }
    .student-item {
      border: 1px solid var(--rule);
      border-radius: 100px;
      padding: 5px 13px;
    }
    .student-item.active { border-color: var(--accent); }
  }

  .page-title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 6px;
  }

  .page-sub {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .search-input {
    flex: 1;
    padding: 9px 12px;
    border-radius: 100px;
    border: 1px solid var(--rule);
    background: #fffdf9;
    font-size: 14px;
    font-family: 'Pretendard', sans-serif;
    color: var(--ink);
  }
  .search-input:focus { outline: none; border-color: var(--accent); }

  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 100px;
    padding: 9px 20px;
    font-size: 14px;
    font-family: 'Pretendard', sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:hover { background: var(--accent-deep); }

  .form-card {
    display: none;
    background: var(--paper);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(44,36,22,0.08);
  }

  .form-row { margin-bottom: 12px; }

  .form-row label {
    display: block;
    font-size: 12px;
    color: var(--sage);
    font-weight: 600;
    margin-bottom: 5px;
  }

  .form-row input[type=text], .form-row input[type=date], .form-row textarea {
    width: 100%;
    padding: 9px 11px;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background: #fffdf9;
    color: var(--ink);
    font-size: 14.5px;
    font-family: 'Pretendard', sans-serif;
    line-height: 1.6;
  }

  .form-row textarea { min-height: 90px; resize: vertical; }
  .form-row input:focus, .form-row textarea:focus { outline: none; border-color: var(--accent); }

  .name-history {
    display: none;
    background: var(--sage-bg);
    border-radius: 4px;
    padding: 10px 12px;
    margin: -4px 0 12px;
  }

  .name-history-label {
    font-size: 11.5px;
    color: var(--sage);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .name-history-item {
    font-size: 13px;
    line-height: 1.6;
    color: #3d4331;
    padding: 6px 0;
    border-top: 1px dashed var(--rule);
  }
  .name-history-item:first-child { border-top: none; }

  .name-history-date {
    font-size: 11px;
    color: var(--sage);
    font-weight: 600;
    margin-right: 4px;
  }

  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    border-radius: 100px;
    padding: 8px 18px;
    font-size: 13.5px;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent-deep); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 13.5px;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
  }
  .btn-primary:hover { background: var(--accent-deep); }

  .day-group { margin-bottom: 12px; }

  .day-label {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-deep);
    margin-bottom: 0;
    padding: 10px 4px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-user-select: none;
    user-select: none;
  }
  .day-label:hover { color: var(--accent); }

  .day-toggle-icon {
    font-size: 11px;
    color: var(--ink-soft);
    width: 12px;
    display: inline-block;
  }

  .day-count {
    font-family: 'Pretendard', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .day-body {
    padding-top: 12px;
  }
  .day-group.collapsed .day-body { display: none; }

  .entry-card {
    background: var(--paper);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(44,36,22,0.08);
  }

  .entry-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .entry-name {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 15.5px;
    color: var(--ink);
  }

  .entry-actions { display: flex; gap: 6px; }

  .mini-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    border-radius: 100px;
    padding: 3px 11px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
  }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent-deep); }
  .mini-btn.copied { color: var(--sage); border-color: var(--sage); }

  .entry-text {
    font-size: 14px;
    line-height: 1.75;
    white-space: pre-line;
    color: var(--ink);
  }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
    padding: 30px 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="page-title">학부모 피드백 모음</div>
  <div class="page-sub">박유경T · 그날그날 보낸 피드백을 모아둡니다<br><span style="font-size:12px;">데이터는 이 브라우저에 저장됩니다.</span></div>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="학생 이름으로 검색">
    <button class="add-btn" onclick="toggleForm()">+ 새 피드백</button>
  </div>

  <div class="form-card" id="formCard">
    <div class="form-row">
      <label id="formHeading" style="font-size:13px;color:var(--accent-deep);font-weight:700;">새 피드백</label>
    </div>
    <div class="form-row">
      <label>학생 이름</label>
      <input type="text" id="fName" placeholder="예: 유지아 (입력 후 Enter)">
    </div>
    <div class="name-history" id="nameHistory">
      <div class="name-history-label">이 학생의 지난 기록</div>
      <div id="nameHistoryList"></div>
    </div>
    <div class="form-row">
      <label>날짜</label>
      <input type="date" id="fDate">
    </div>
    <div class="form-row">
      <label>피드백 내용</label>
      <textarea id="fText" placeholder="정리된 피드백 문구를 붙여넣으세요"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="toggleForm()">취소</button>
      <button class="btn-primary" onclick="saveEntry()">저장</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">학생 목록</div>
      <div class="student-list" id="studentList"></div>
    </div>
    <div class="main-col">
      <div id="archiveList"><div class="empty-state">불러오는 중...</div></div>
    </div>
  </div>
</div>

<script>
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

document.getElementById('fDate').value = todayStr();

let editingKey = null;

function toggleForm(prefill) {
  const card = document.getElementById('formCard');
  const heading = document.getElementById('formHeading');
  const show = prefill ? true : card.style.display !== 'block';
  card.style.display = show ? 'block' : 'none';
  document.getElementById('nameHistory').style.display = 'none';

  if (show && prefill) {
    editingKey = prefill.key;
    heading.textContent = prefill.name + ' 피드백 수정';
    document.getElementById('fName').value = prefill.name;
    document.getElementById('fText').value = prefill.text;
    document.getElementById('fDate').value = prefill.date;
    document.getElementById('fText').focus();
  } else if (show) {
    editingKey = null;
    heading.textContent = '새 피드백';
    document.getElementById('fName').value = '';
    document.getElementById('fText').value = '';
    document.getElementById('fDate').value = todayStr();
    document.getElementById('fName').focus();
  } else {
    editingKey = null;
  }
}

function editEntry(key) {
  const entry = allEntries.find(function(e) { return e.key === key; });
  if (!entry) return;
  toggleForm({ key: entry.key, name: entry.name, date: entry.date, text: entry.text });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showNameHistory(name) {
  const panel = document.getElementById('nameHistory');
  const listEl = document.getElementById('nameHistoryList');
  if (!name) {
    panel.style.display = 'none';
    return;
  }
  const matches = allEntries.filter(function(e) {
    return e.name === name && e.key !== editingKey;
  });
  if (matches.length === 0) {
    listEl.innerHTML = '<div class="name-history-item">지난 기록이 없습니다.</div>';
  } else {
    listEl.innerHTML = matches.map(function(e) {
      const escText = e.text.replace(/</g, '&lt;');
      return '<div class="name-history-item"><span class="name-history-date">' + e.date + '</span>' + escText.replace(/\n/g, '<br>') + '</div>';
    }).join('');
  }
  panel.style.display = 'block';
}

document.getElementById('fName').addEventListener('keydown', function(ev) {
  if (ev.key === 'Enter') {
    ev.preventDefault();
    showNameHistory(this.value.trim());
  }
});

document.getElementById('fName').addEventListener('input', function() {
  document.getElementById('nameHistory').style.display = 'none';
});

const STORE_KEY = 'kladi_feedback_archive_v1';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveStore(store) {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

async function saveEntry() {
  const name = document.getElementById('fName').value.trim();
  const date = document.getElementById('fDate').value;
  const text = document.getElementById('fText').value.trim();

  if (!name || !text || !date) {
    alert('학생 이름, 날짜, 피드백 내용을 모두 입력해주세요.');
    return;
  }

  const key = editingKey || ('feedback:' + date + '-' + Date.now());

  try {
    const store = loadStore();
    store[key] = { name: name, date: date, text: text };
    saveStore(store);
  } catch (e) {
    alert('저장에 실패했습니다. 다시 시도해주세요.');
    return;
  }

  editingKey = null;
  toggleForm();
  loadArchive();
}

async function deleteEntry(key) {
  if (!confirm('이 피드백을 삭제할까요?')) return;
  try {
    const store = loadStore();
    delete store[key];
    saveStore(store);
  } catch (e) {}
  loadArchive();
}

function copyEntry(text, btn) {
  navigator.clipboard.writeText(text).then(function() {
    const original = btn.textContent;
    btn.textContent = '복사됨';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  });
}

let allEntries = [];
let activeStudent = null;
const expandedDates = new Set();

async function loadArchive() {
  const listEl = document.getElementById('archiveList');
  try {
    const store = loadStore();
    const entries = Object.keys(store).map(function(k) {
      const data = store[k];
      return { key: k, name: data.name, date: data.date, text: data.text };
    });
    entries.sort(function(a, b) { return (b.date + b.key).localeCompare(a.date + a.key); });
    allEntries = entries;
    renderStudentList();
    renderArchive();
  } catch (e) {
    listEl.innerHTML = '<div class="empty-state">기록을 불러오지 못했습니다.</div>';
  }
}

const ALL_STUDENTS = ["서민경", "이서현", "장서은", "황유찬", "전재우", "이환", "홍제인", "박하윤", "이아영", "유지아", "김리사", "이아진", "엄승유", "최준서", "정지현", "이준철", "전윤아", "이준현", "김이준", "여채율", "유소율", "유이재", "최태훈", "김유주", "배경윤", "이채원B", "배은빈"];

function renderStudentList() {
  const el = document.getElementById('studentList');
  const names = ALL_STUDENTS.slice().sort(function(a, b) { return a.localeCompare(b, 'ko'); });

  let html = '<button class="student-item' + (activeStudent === null ? ' active' : '') + '" onclick="selectStudent(null)">전체</button>';
  names.forEach(function(name) {
    const escName = name.replace(/'/g, "\\'");
    const hasEntries = allEntries.some(function(e) { return e.name === name; });
    html += '<button class="student-item' + (activeStudent === name ? ' active' : '') + (hasEntries ? '' : ' no-entry') + '" onclick="selectStudent(\'' + escName + '\')">' + name + '</button>';
  });
  el.innerHTML = html;
}

function selectStudent(name) {
  activeStudent = name;
  document.getElementById('searchInput').value = '';
  renderStudentList();
  renderArchive();
}

function toggleDay(date) {
  if (expandedDates.has(date)) {
    expandedDates.delete(date);
  } else {
    expandedDates.add(date);
  }
  renderArchive();
}

function renderArchive() {
  const listEl = document.getElementById('archiveList');
  const query = document.getElementById('searchInput').value.trim();
  let filtered = allEntries;
  if (activeStudent !== null) {
    filtered = filtered.filter(function(e) { return e.name === activeStudent; });
  } else if (query) {
    filtered = filtered.filter(function(e) { return e.name.includes(query); });
  }

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty-state">' + (query || activeStudent ? '검색 결과가 없습니다.' : '아직 저장된 피드백이 없습니다. "+ 새 피드백"으로 추가해보세요.') + '</div>';
    return;
  }

  const groups = {};
  const order = [];
  filtered.forEach(function(e) {
    if (!groups[e.date]) { groups[e.date] = []; order.push(e.date); }
    groups[e.date].push(e);
  });

  let html = '';
  order.forEach(function(date) {
    const isOpen = expandedDates.has(date);
    html += '<div class="day-group' + (isOpen ? '' : ' collapsed') + '">' +
      '<div class="day-label" onclick="toggleDay(\'' + date + '\')">' +
        '<span class="day-toggle-icon">' + (isOpen ? '▾' : '▸') + '</span>' +
        '<span>' + date + '</span>' +
        '<span class="day-count">' + groups[date].length + '건</span>' +
      '</div>' +
      '<div class="day-body">';
    groups[date].forEach(function(e) {
      const escText = e.text.replace(/</g, '&lt;');
      html +=
        '<div class="entry-card">' +
          '<div class="entry-head">' +
            '<div class="entry-name">' + e.name + '</div>' +
            '<div class="entry-actions">' +
              '<button class="mini-btn" onclick=\'copyEntry(document.getElementById("txt-' + e.key + '").textContent, this)\'>복사</button>' +
              '<button class="mini-btn" onclick="editEntry(\'' + e.key + '\')">수정</button>' +
              '<button class="mini-btn" onclick="deleteEntry(\'' + e.key + '\')">삭제</button>' +
            '</div>' +
          '</div>' +
          '<div class="entry-text" id="txt-' + e.key + '">' + escText + '</div>' +
        '</div>';
    });
    html += '</div></div>';
  });
  listEl.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', function() {
  if (this.value.trim()) { activeStudent = null; renderStudentList(); }
  renderArchive();
});

loadArchive();
</script>

</body>
</html>
